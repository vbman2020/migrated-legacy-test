version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: realworld_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-realworld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realworld_password}
      POSTGRES_DB: ${POSTGRES_DB:-realworld_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-realworld} -d ${POSTGRES_DB:-realworld_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realworld_network

  redis:
    image: redis:7-alpine
    container_name: realworld_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realworld_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realworld_app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-realworld}:${POSTGRES_PASSWORD:-realworld_password}@db:5432/${POSTGRES_DB:-realworld_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        sleep 2 &&
        echo 'Running database migrations...' &&
        alembic upgrade head &&
        echo 'Starting FastAPI application...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    networks:
      - realworld_network
    restart: unless-stopped

networks:
  realworld_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local