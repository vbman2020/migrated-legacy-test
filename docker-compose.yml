version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: conduit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conduit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conduit_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-conduit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conduit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conduit_network

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: conduit_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conduit_network

  # FastAPI application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conduit_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Application settings
      APP_NAME: ${APP_NAME:-Conduit}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      
      # Database configuration
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-conduit}:${POSTGRES_PASSWORD:-conduit_dev_password}@db:5432/${POSTGRES_DB:-conduit}
      
      # Redis configuration
      REDIS_URL: redis://redis:6379/0
      
      # JWT settings
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      
      # CORS settings
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    command: >
      sh -c "
        echo 'Waiting for database...'
        sleep 5
        echo 'Running migrations...'
        alembic upgrade head
        echo 'Starting application...'
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    networks:
      - conduit_network

  # Database migration service (one-time)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conduit_migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-conduit}:${POSTGRES_PASSWORD:-conduit_dev_password}@db:5432/${POSTGRES_DB:-conduit}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    command: alembic upgrade head
    networks:
      - conduit_network
    profiles:
      - migration

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  conduit_network:
    driver: bridge